[package]
name         = "speaklab-server"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.75"
description  = "SpeakLab 的可选后端：练习记录同步与本地语音识别"
license      = "MIT"
publish      = false

[dependencies]
# Web 框架与运行时
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "compression-gzip"] }
hyper = "1"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 可观测性
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
thiserror = "1"
anyhow = "1"

# 其他
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "macros"] }

[features]
default = []
# 本地语音识别。需要 cmake 和 C++ 编译器，并且会拉取 whisper.cpp。
# 没装工具链时保持关闭，服务照常运行，相关接口返回 501。
whisper = ["dep:whisper-rs"]

[dependencies.whisper-rs]
version  = "0.12"
optional = true

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
panic         = "abort"
